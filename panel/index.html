<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Atelier</title>
<link rel="stylesheet" href="panel.css">
</head>
<body>
  <!--
    The page is drawn over the whole screen, and only the side panel is
    opaque: the character stays visible in the rest of it, which is the
    point of editing live.
  -->
  <aside id="panel" class="panel">
    <header class="panel-header">
      <h1 class="panel-title">Atelier</h1>
      <!--
        Always-present shortcuts (E2 item 8): one click from anywhere in the
        scrolled list to Presets or Body, and to RaceMenu's own Sculpt.
        Buttons that jump, not a second navigation structure - shortcuts.js.
      -->
      <nav id="shortcuts" class="shortcuts" aria-label="Quick access">
        <button id="shortcut-presets" class="panel-button" type="button">Presets</button>
        <button id="shortcut-obody" class="panel-button" type="button">Body</button>
        <button id="shortcut-sculpt" class="panel-button" type="button" title="Opens RaceMenu (F4 comes back)">Sculpt</button>
      </nav>
      <span id="bridge-status" class="status status-wait">connecting</span>
    </header>

    <!--
      Search, the "changed" filter and the counter (E2 items 3, 4, 5): a
      second bar, outside the scrolled list for the same reason the header
      and footer are - search.js.
    -->
    <div id="toolbar" class="panel-toolbar">
      <input id="search" class="preset-field" type="text" spellcheck="false" autocomplete="off" placeholder="Search sliders">
      <button id="filter-changed" class="panel-button" type="button" aria-pressed="false">Changed</button>
      <!--
        Undo and redo are buttons and not Ctrl+Z / Ctrl+Y on purpose: Meridian
        delivers some key presses twice, ~15 ms apart, as fresh presses
        (measured in keyboard.js), and an undo that fires twice undoes a step
        the player never asked about and says nothing. A click cannot double.
      -->
      <button id="undo" class="panel-button" type="button" disabled>Undo</button>
      <button id="redo" class="panel-button" type="button" disabled>Redo</button>
      <span id="row-counter" class="versions"></span>
    </div>

    <main id="sections" class="panel-body">
      <p class="placeholder">No sections yet.</p>

      <!--
        The character's name and the button that ends the menu. finish.js
        wraps this into the panel's FIRST section: they are the character's
        identity, not a footer. A plain text input on purpose: keyboard.js
        corrects the keyboard only for textarea and input of type text,
        search or none.
      -->
      <div id="finish">
        <label class="finish-label" for="finish-name">Name</label>
        <div class="finish-row">
          <input id="finish-name" class="preset-field" type="text" spellcheck="false" autocomplete="off">
          <button id="finish-button" class="panel-button" type="button">Finish</button>
        </div>
        <p id="finish-note" class="finish-note" hidden></p>
      </div>
    </main>

    <footer class="panel-footer">
      <!--
        How big the panel is drawn, set by the player. It sits here, with the
        panel's own controls, because it is a property of the panel and not of
        the character - and it stays on screen, which a readability control
        has to.
      -->
      <div class="scale-group" aria-label="Panel size">
        <button id="scale-down" class="step-button" type="button" title="Smaller">-</button>
        <span id="scale-value" class="versions">100%</span>
        <button id="scale-up" class="step-button" type="button" title="Bigger">+</button>
      </div>
      <span id="versions" class="versions"></span>
      <!--
        One of the two ways back to RaceMenu. The other is F4, which the DLL
        registers with Meridian and which works even when this page does not.
      -->
      <button id="to-racemenu" class="panel-button" type="button" title="F4">RaceMenu</button>
    </footer>
  </aside>

  <!--
    The character view. Transparent: the character inside it is the game's
    own, placed here by the camera (stage.js, Panel/Stage in the DLL).
  -->
  <section id="stage" class="stage" aria-label="Character view">
    <p id="stage-note" class="stage-note"></p>
    <p id="stage-readout" class="stage-readout" hidden></p>
    <div id="stage-bar" class="stage-bar" hidden></div>
  </section>

  <script src="keyboard.js"></script>
  <script src="bridge.js"></script>
  <script src="settings.js"></script>
  <script src="history.js"></script>
  <script src="panel.js"></script>
  <script src="controls.js"></script>
  <script src="shortcuts.js"></script>
  <script src="search.js"></script>
  <script src="picker.js"></script>
  <script src="look.js"></script>
  <script src="scales.js"></script>
  <script src="body.js"></script>
  <script src="tints.js"></script>
  <script src="overlays.js"></script>
  <script src="face.js"></script>
  <script src="presets.js"></script>
  <script src="delegate.js"></script>
  <script src="finish.js"></script>
  <script src="control.js"></script>
  <script src="groups.js"></script>
  <script src="stage.js"></script>
</body>
</html>
