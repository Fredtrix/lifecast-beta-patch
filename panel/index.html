<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Atelier</title>
<link rel="stylesheet" href="panel.css">
</head>
<body>
  <!--
    The page is drawn over the whole screen, and only the side panel is
    opaque: the character stays visible in the rest of it, which is the
    point of editing live.
  -->
  <aside id="panel" class="panel">
    <header class="panel-header">
      <h1 class="panel-title">Atelier</h1>
      <span id="bridge-status" class="status status-wait">connecting</span>
    </header>

    <main id="sections" class="panel-body">
      <p class="placeholder">No sections yet.</p>
    </main>

    <footer class="panel-footer">
      <span id="versions" class="versions"></span>
      <!--
        One of the two ways back to RaceMenu. The other is F4, which the DLL
        registers with Meridian and which works even when this page does not.
      -->
      <button id="to-racemenu" class="panel-button" type="button" title="F4">RaceMenu</button>
    </footer>
  </aside>

  <script src="keyboard.js"></script>
  <script src="bridge.js"></script>
  <script src="panel.js"></script>
  <script src="controls.js"></script>
  <script src="picker.js"></script>
  <script src="look.js"></script>
  <script src="scales.js"></script>
  <script src="tints.js"></script>
  <script src="face.js"></script>
  <script src="presets.js"></script>
  <script src="delegate.js"></script>
</body>
</html>
